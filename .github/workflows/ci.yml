name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/hardening" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code formatting & lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest with 80% minimum coverage
        env:
          APP_API_KEY: ci-test-key-12345
          ENV: development
          GEMINI_FAKE: "1"
          MEMORY_DB_PATH: data/memory.db
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -v

  docker-build-and-smoke:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: enterprise-ai-employee:ci

      - name: Run container and execute smoke test
        run: |
          docker run -d --name test-app \
            -p 8000:8000 \
            -e ENV=development \
            -e APP_API_KEY=ci-smoke-key \
            -e GEMINI_FAKE=1 \
            enterprise-ai-employee:ci

          # Wait for container healthcheck
          sleep 5

          # Execute smoke test script
          python scripts/smoke_test.py --base-url http://localhost:8000 --api-key ci-smoke-key

          # Cleanup
          docker stop test-app
