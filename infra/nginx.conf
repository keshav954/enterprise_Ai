# ─────────────────────────────────────────────────────────────
# Enterprise AI Employee – Production Nginx Reverse Proxy
# Place in: /etc/nginx/sites-available/enterprise-ai
# Symlink:  ln -s /etc/nginx/sites-available/enterprise-ai /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────

# Rate limiting zone: 30 requests per minute per client IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_status 429;

upstream enterprise_ai_backend {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# HTTP Server — Redirects to HTTPS in production
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME Challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other traffic to HTTPS (uncomment when SSL certificate is active)
    # return 301 https://$host$request_uri;

    # For pre-SSL or reverse-proxy testing, proxy to application
    location / {
        proxy_pass http://enterprise_ai_backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Streaming / SSE / Long-running agent task support
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        # Max payload size for knowledge-base document uploads
        client_max_body_size 25M;
    }
}

