services:
  - type: web
    name: enterprise-ai-employee
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    disk:
      name: enterprise-ai-data
      mountPath: /app/data
      sizeGB: 10
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: APP_API_KEY
        sync: false
      - key: ENV
        value: production
      - key: PORT
        value: 8000
