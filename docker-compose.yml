# ─────────────────────────────────────────────────────────────
# Enterprise AI Employee – Docker Compose (Development & Production)
# ─────────────────────────────────────────────────────────────
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-ai-employee
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist runtime data across restarts
      - ./workspace:/app/workspace
      - ./data:/app/data
      - ./knowledge_base:/app/knowledge_base
      - ./reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
